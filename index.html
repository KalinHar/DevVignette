<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta
        content="width=device-width,maximum-scale=1.0,initial-scale=1.0,minimum-scale=1.0,user-scalable=yes,shrink-to-fit=no"
        name="viewport" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="public/car_info.svg">
    <title>Car Papers</title>
</head>

<body>
    <div class="card">
        <div>
            <h1 class="h-mar">Car Papers</h1>
        </div>

        <div class="input-data">
            <div>
                <strong>Favorites: </strong>
                <select id="favoritesSelect" onchange="selectFavorite(this.value)">
                    <option value="">-- Select --</option>
                </select>
            </div>

            <div>
                <strong>Number: </strong>
                <input type="text" id="licensePlateNumber" />
                <button id="addBtn" onclick="addFavorite()" disabled>Add to favorites</button>
                <div id="validationMsg"></div>
            </div>
        </div>

        <div class="btn-group">
            <button onClick="checkVignette()">Check Vignette</button>
            <button onClick="checkInsurance()">Check Insurance</button>
            <button onClick="checkGTP()">Check Inspection (GTP)</button>
        </div>

        <div class="relative-box">
            <h1 class="h-mar" id="vignette-result"></h1>
            <span class="clear-x" onclick="clearVignetteResult()">×</span>
        </div>

        <div>
            <button id="scanBtn">Take Photo</button>
            <input type="file" id="camera" accept="image/*" capture="environment" style="display:none">
            <div class="relative-box">
                <pre id="photoResult">Take photo to get number</pre>
                <span class="clear-x" onclick="clearPhotoText()">×</span>
            </div>
            <button onClick="addPhotoText()">Add Number</button>
        </div>
    </div>

    <script>
        const favorites = ["BT5609KX", "P2244KH", "P6792BH"];
        const plateRegex = /^[A-Z0-9]+$/;

        const favoritesSelect = document.getElementById("favoritesSelect");
        const plateNumber = document.getElementById("licensePlateNumber");
        const addButton = document.getElementById("addBtn");
        const msg = document.getElementById("validationMsg");
        const resultField = document.getElementById("vignette-result");

        plateNumber.addEventListener("input", () => {
            plateNumber.value = plateNumber.value.toUpperCase();
            const value = plateNumber.value;

            if (value.length === 0) {
                addButton.disabled = true;
                msg.textContent = "";
                return;
            }

            if (!plateRegex.test(value)) {
                addButton.disabled = true;
                msg.textContent = "Only letters (A–Z) and numbers (0–9) are allowed.";
            } else {
                addButton.disabled = false;
                msg.textContent = "";
            }
        });

        setOptions();

        function setOptions() {
            while (favoritesSelect.children.length > 1) {
                favoritesSelect.removeChild(favoritesSelect.lastChild);
            }

            favorites.forEach((plate) => {
                const option = document.createElement("option");
                option.value = plate;
                option.textContent = plate;
                favoritesSelect.appendChild(option);
            });
        }

        function selectFavorite(plate) {
            plateNumber.value = plate;
        }

        function addFavorite() {
            if (favorites.includes(plateNumber.value)) return;
            favorites.push(plateNumber.value);
            setOptions();
        }

        function clearVignetteResult() {
            resultField.innerText = "";
        }

        async function checkVignette() {
            if (!plateNumber.value) return;
            try {
                const response = await axios.get(
                    `https://check.bgtoll.bg/check/vignette/plate/BG/${plateNumber.value}`,
                );
                if (response.data.vignette) {
                    resultField.innerText = `The vehicle has a valid vignette to ${response.data.vignette.validityDateToFormated}`;
                } else {
                    resultField.innerText = "The vehicle doesn't have a valid vignette!";
                }
            } catch (err) {
                console.error(
                    "Get Vignette error:",
                    err.response?.data || err.message,
                );
                resultField.innerText = '';
            }
        }

        function checkInsurance() {
            const lpn = plateNumber.value.replace(/\s+/g, "");
            navigator.clipboard.writeText(lpn);
            window.open(
                "https://www.guaranteefund.org/bg/%D0%B8%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%B5%D0%BD-%D1%86%D0%B5%D0%BD%D1%82%D1%8A%D1%80-%D0%B8-%D1%81%D0%BF%D1%80%D0%B0%D0%B2%D0%BA%D0%B8/%D1%83%D1%81%D0%BB%D1%83%D0%B3%D0%B8/%D0%BF%D1%80%D0%BE%D0%B2%D0%B5%D1%80%D0%BA%D0%B0-%D0%B7%D0%B0-%D0%B2%D0%B0%D0%BB%D0%B8%D0%B4%D0%BD%D0%B0-%D0%B7%D0%B0%D1%81%D1%82%D1%80%D0%B0%D1%85%D0%BE%D0%B2%D0%BA%D0%B0-%D0%B3%D1%80a%D0%B6%D0%B4a%D0%BD%D1%81%D0%BAa-%D0%BE%D1%82%D0%B3%D0%BE%D0%B2%D0%BE%D1%80%D0%BD%D0%BE%D1%81%D1%82-%D0%BD%D0%B0-%D0%B0%D0%B2%D1%82%D0%BE%D0%BC%D0%BE%D0%B1%D0%B8%D0%BB%D0%B8%D1%81%D1%82%D0%B8%D1%82%D0%B5",
                "_blank",
            );
        }

        function checkGTP() {
            const lpn = plateNumber.value.replace(/\s+/g, "");
            navigator.clipboard.writeText(lpn);
            window.open(
                "https://rta.government.bg/services/check-inspection/",
                "_blank",
            );
        }

        // == Photo extractor ==
        const scanBtn = document.getElementById('scanBtn');
        const camera = document.getElementById('camera');
        const photoResult = document.getElementById('photoResult');

        // Open camera/file picker
        scanBtn.addEventListener('click', () => {
            camera.click();
        });

        // Processing photo
        camera.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            photoResult.textContent = 'Extracting text...';
            try {
                const { data } = await Tesseract.recognize(file, 'eng');
                const value = data.text.trim().toUpperCase();
                if (value.length < 11 && plateRegex.test(value)) {
                    photoResult.textContent = value;
                    plateNumber.value = value;
                    addButton.disabled = false;
                } else {
                    photoResult.textContent = 'Invalid data: \n' + data.text;
                }
            } catch (err) {
                photoResult.textContent = 'Error: ' + err.message;
            }
        });

        function addPhotoText() {
            plateNumber.value = photoResult.textContent;
            addButton.disabled = false;
        }

        function clearPhotoText() {
            photoResult.textContent = 'Take photo to get number';
        }

    </script>

    <style>
        body {
            background-color: rgb(239, 238, 238);
            font-family: monospace;
            font-size: large;
        }

        .card {
            display: flex;
            flex-direction: column;
            gap: 1em;
        }

        .card div {
            margin: auto;
        }

        .input-data input {
            width: 6em;
            margin-top: 0.5em;
        }

        .h-mar {
            margin-top: 0.4em;
            margin-bottom: 0.6em;
        }

        .btn-group {
            display: flex;
            gap: .5em;
        }

        #validationMsg {
            color: red;
            margin-top: 0.25em;
            font-size: medium;
        }

        .relative-box {
            position: relative;
            padding: 0.5em;
            margin: 1em 0 1em !important;
            background: #f5f5f5;
            border-radius: 5px;
            min-height: 40px;
        }

        .clear-x {
            position: absolute;
            top: 4px;
            right: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #666;
            line-height: 1;
        }

        .clear-x:hover {
            color: #000;
        }
    </style>
</body>

</html>
